name: disaster_management_app
description: A production-ready Disaster Management Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  google_maps_flutter: ^2.5.3
  
  lottie: ^3.1.0
  shimmer: ^3.0.0
  
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0
  uuid: ^4.3.3
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10
  connectivity_plus: ^6.0.3
  
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  socket_io_client: ^3.1.6
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  tflite_flutter: ^0.11.0
  
  # Walkie-Talkie Dependencies
  nearby_connections: ^4.3.0
  record: ^6.0.0
  flutter_sound: ^9.2.13
  geolocator: ^11.0.0
  flutter_map_cache: ^1.5.2
  dio_cache_interceptor_file_store: ^1.2.3
  path_provider: ^2.1.6
  dio: ^5.11.0
  dio_cache_interceptor: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/lottie/
    - assets/illustrations/
    - assets/logos/
    - assets/placeholders/
    - assets/ml/
    - assets/offline_manuals/
